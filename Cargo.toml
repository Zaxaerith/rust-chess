[package]
name = "chess_rust"
version = "0.2.1"
edition = "2024"
build = "build.rs"

[dependencies]
ab_glyph = "0.2"
chasolver = "=3.0.0"
chess = "3.2"
minifb = "0.27"
pleco = "0.5"
png = "0.17"
pgn-reader = "=0.26.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shakmaty = "0.27"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "wingdi", "libloaderapi"] }
